name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Compile Multi-Platform Binaries
        run: |
          mkdir -p dist
          # Linux AMD64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/synapse-linux-amd64 ./cmd/synapse
          tar -czf dist/synapse-linux-amd64.tar.gz -C dist synapse-linux-amd64
          # Linux ARM64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/synapse-linux-arm64 ./cmd/synapse
          tar -czf dist/synapse-linux-arm64.tar.gz -C dist synapse-linux-arm64
          # macOS AMD64
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/synapse-darwin-amd64 ./cmd/synapse
          tar -czf dist/synapse-darwin-amd64.tar.gz -C dist synapse-darwin-amd64
          # macOS ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/synapse-darwin-arm64 ./cmd/synapse
          tar -czf dist/synapse-darwin-arm64.tar.gz -C dist synapse-darwin-arm64
          # Windows AMD64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/synapse.exe ./cmd/synapse
          tar -czf dist/synapse-windows-amd64.tar.gz -C dist synapse.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SynapseCode ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
